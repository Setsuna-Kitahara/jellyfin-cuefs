name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: python syntax
        run: python -m py_compile app/cuefs.py app/taklib.py app/takdec.py app/import_tak.py tools/verify_container.py tools/build_docs_site.py tools/md2html.py sample/build_sample.py
      - name: shell syntax
        run: bash -n tools/smoke_test.sh
      - name: docs site renders
        run: |
          python tools/build_docs_site.py _site
          test -s _site/index.html
          test -s _site/configurator.html
          test -s _site/14-NAMING.html
          echo "站点页数: $(ls _site/*.html | wc -l)"

      - name: cue parser unit check
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, 'app')
          import cuefs
          # mm:ss:ff（75 帧/秒）-> 秒，需帧精确：3 帧 = 3/75 = 0.04 s
          assert cuefs.cue_time('00:00:00') == 0.0
          assert abs(cuefs.cue_time('01:01:03') - 61.04) < 1e-9
          assert cuefs.cue_time('00:00:75') == 1.0      # 75 帧 = 1 秒
          assert cuefs.cue_time('') == 0.0 and cuefs.cue_time(None) == 0.0
          # 路径安全化：分隔符/通配符全部折叠成下划线
          n = cuefs.safe_name('a/b:c*?')
          assert '/' not in n and n == 'a_b_c_', n
          assert cuefs.safe_name('') == 'untitled'
          assert cuefs.safe_name('...') == 'untitled'
          print('ok')
          PY

  build-slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build slim image
        run: docker build -f docker/Dockerfile.slim -t cuefs:ci-slim .
      - name: make a tiny FLAC + CUE fixture
        run: |
          mkdir -p /tmp/m/src /tmp/m/overlay
          docker run --rm -v /tmp/m/src:/out --entrypoint bash cuefs:ci-slim -c '
            ffmpeg -v error -f lavfi -i "sine=frequency=440:duration=3" \
                   -f lavfi -i "sine=frequency=660:duration=4" \
                   -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1" \
                   -ac 2 -ar 44100 -c:a flac "/out/disc.flac" &&
            printf "FILE \"disc.flac\" WAVE\n  TRACK 01 AUDIO\n    TITLE \"A\"\n    PERFORMER \"ci\"\n    INDEX 01 00:00:00\n  TRACK 02 AUDIO\n    TITLE \"B\"\n    PERFORMER \"ci\"\n    INDEX 01 00:03:00\n" > /out/disc.cue
          '
          ls -l /tmp/m/src

      - name: run cuefs (ffmpeg backend)
        run: |
          docker run -d --name cuefs -p 127.0.0.1:8099:8099 \
            -v /tmp/m/src:/music-src:ro -v /tmp/m/overlay:/music-overlay \
            -e CUEFS_BACKEND=ffmpeg cuefs:ci-slim
          sleep 3
          curl -fsS http://127.0.0.1:8099/ | head -c 400
      - name: smoke test
        run: bash tools/smoke_test.sh http://127.0.0.1:8099 cuefs
      - name: logs on failure
        if: failure()
        run: docker logs cuefs || true
